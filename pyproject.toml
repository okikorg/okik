[tool.poetry]
name = "okik"
version = "0.0.342"
description = "A Python package to serve python functions, classes, or .py files on a local server or cloud-based environment."
authors = ["Okik <akash@okik.co.uk>"]
homepage = "https://www.okik.co.uk/"
readme = "README.md"
packages = [{ include = "okik" }]

[tool.poetry.dependencies]
python = "^3.10"
annotated-types = "*"
anyio = "*"
art = "*"
click = "*"
fastapi = "*"
filelock = "*"
fsspec = "*"
idna = "*"
Jinja2 = "*"
markdown-it-py = "*"
MarkupSafe = "*"
mdurl = "*"
mpmath = "*"
pydantic = ">=2.0.0"
pydantic_core = "*"
pyfiglet = "*"
Pygments = "*"
PyYAML = "*"
rich = "*"
shellingham = "*"
sniffio = "*"
starlette = "*"
sympy = "*"
networkx = "*"
torch = "*"
typer = "*"
typing_extensions = "*"
numpy = "*"
httpie = "*"
kubernetes = "*"
questionary = "^2.0.1"

[tool.poetry.scripts]
okik = "okik.main:typer_app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "okik"
version = "0.0.342"
description = "A Python package to serve python functions, classes, or .py files on a local server or cloud-based environment."
readme = "README.md"
dependencies = [
    "uvicorn>=0.30.6",
    "rich>=13.7.1",
    "torch>=2.4.0",
    "uuid>=1.30",
    "typer>=0.12.4",
    "kubernetes>=30.1.0",
    "pydantic>=2.8.2",
    "click>=8.1.7",
    "numpy>=2.1.0",
    "httpie>=3.2.3",
    "questionary>=2.0.1",
    "networkx>=3.3",
    "pyfiglet>=1.0.2",
    "pyyaml>=6.0.2",
    "sympy>=1.13.2",
    "starlette>=0.38.2",
    "fastapi>=0.112.1",
    "art>=6.2",
    "jinja2>=3.1.4",
    "pydantic-core>=2.20.1",
    "mdurl>=0.1.2",
    "pygments>=2.18.0",
    "shellingham>=1.5.4",
    "typing-extensions>=4.12.2",
    "fsspec>=2024.6.1",
    "idna>=3.7",
    "anyio>=4.4.0",
    "annotated-types>=0.7.0",
]


[tool.uv]
dev-dependencies = []
